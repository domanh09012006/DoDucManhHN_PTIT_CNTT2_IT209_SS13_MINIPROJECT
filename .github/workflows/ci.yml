name: CI/CD Pipeline - Campus Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Integration & Unit Tests
        run: ./gradlew test
        working-directory: ./backend

      - name: Build Backend Boot JAR
        run: ./gradlew bootJar -x test
        working-directory: ./backend

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Build Frontend SPA
        run: npm run build
        working-directory: ./frontend

  docker-build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t campushub-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t campushub-frontend:latest ./frontend
